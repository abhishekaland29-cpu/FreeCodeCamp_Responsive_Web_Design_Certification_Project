<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #34495e;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #455a64;
        }

        span {
            display: inline-block;
        }

        tr[class="read"] {
            background-image: linear-gradient(to right, #27ae60, #34495e);
        }

        tr[class="to-read"] {
            background-image: linear-gradient(to right, #c0392b, #34495e);
        }

        tr[class="in-progress"] {
            background-image: linear-gradient(to right, #2980b9, #34495e);
        }

        tr[class="to-read"] span[class="status"] {
            border: 2px solid white;
            background-image: linear-gradient(#e74c3c, #c0392b);
        }

        tr[class="read"] span[class="status"] {
            border: 2px solid white;
            background-image: linear-gradient(#2ecc71, #27ae60);
        }

        tr[class="in-progress"] span[class="status"] {
            border: 2px solid white;
            background-image: linear-gradient(#3498db, #2980b9);
        }

        span[class="status"], span[class^="rate"] {
            height: 25px;
            width: 110px;
            padding: 5px;
            text-align: center;
        }

        span[class^="rate"] > span {
            border: 1px solid #bdc3c7;
            border-radius: 50%;
            margin: 2px;
            height: 15px;
            width: 15px;
            background-color: #7f8c8d;
        }

        span[class~="one"] span:first-child {
            background-image: linear-gradient(#f1c40f, #f39c12);
        }

        span[class~="two"] span:first-child, 
        span[class~="two"] span:nth-child(2) {
            background-image: linear-gradient(#f1c40f, #f39c12);
        }

        span[class~="three"] span {
            background-image: linear-gradient(#f1c40f, #f39c12);
        }
        

    </style>
</head>
<body>

    <h1>Book Inventory</h1>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Rate</th>
            </tr>
        </thead>
        <tbody>
            <tr class="read">
                <td>Foundation</td>
                <td>Isaac Asimov</td>
                <td>Sci-Fi</td>
                <td><span class="status">Read</span></td>
                <td>
                    <span class="rate three"><span></span><span></span><span></span></span>
                </td>
            </tr>
            <tr class="in-progress">
                <td>The Hobbit</td>
                <td>J.R.R. Tolkien</td>
                <td>Fantasy</td>
                <td><span class="status">In Progress</span></td>
                <td>
                    <span class="rate"><span></span><span></span><span></span></span>
                </td>
            </tr>
            <tr class="to-read">
                <td>Dracula</td>
                <td>Bram Stoker</td>
                <td>Horror</td>
                <td><span class="status">To Read</span></td>
                <td>
                    <span class="rate"><span></span><span></span><span></span></span>
                </td>
            </tr>
            <tr class="read">
                <td>The Alchemist</td>
                <td>Paulo Coelho</td>
                <td>Fiction</td>
                <td><span class="status">Read</span></td>
                <td>
                    <span class="rate one"><span></span><span></span><span></span></span>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
